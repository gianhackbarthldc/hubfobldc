<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Hub FOB</title>
    <script>
      // GitHub Pages SPA redirect
      // Salva o path/query/hash completo e redireciona para index.html
      var location = window.location
      sessionStorage.setItem(
        'spa_redirect',
        JSON.stringify({
          path: location.pathname,
          query: location.search,
          hash: location.hash,
        })
      )
      location.replace(location.protocol + '//' + location.hostname + (location.port ? ':' + location.port : '') + '/hufobldc/')
    </script>
  </head>
  <body></body>
</html>
